name: Launch contract

on:
  push:
    branches:
      - main
      - feat/nima-premium-mockup-implementation
    paths:
      - 'theme/**'
      - 'tests/test_launch_theme_contract.py'
      - 'tests/test_locale_contract.py'
      - '.github/workflows/launch-contract.yml'
  pull_request:
    paths:
      - 'theme/**'
      - 'tests/test_launch_theme_contract.py'
      - 'tests/test_locale_contract.py'
      - '.github/workflows/launch-contract.yml'

jobs:
  launch-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: pytest -q tests/test_launch_theme_contract.py tests/test_locale_contract.py
