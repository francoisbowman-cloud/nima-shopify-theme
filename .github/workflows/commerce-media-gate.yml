name: Commerce media gate

on:
  pull_request:
    paths:
      - 'catalog/commerce-media-manifest.json'
      - '.github/commerce_media_normalizer.py'
      - '.github/workflows/commerce-media-gate.yml'
      - 'tests/test_commerce_media_pipeline_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commerce-media-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NIMA_MEDIA_OUT: commerce-media-evidence
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow==11.3.0 numpy==2.3.2 requests==2.32.4

      - name: Run commerce media audit and golden normalization
        run: python .github/commerce_media_normalizer.py

      - name: Publish commerce media summary
        if: always()
        run: |
          if [ -f commerce-media-evidence/REPORT.md ]; then
            cat commerce-media-evidence/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit and normalized assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nima-commerce-media-evidence
          path: commerce-media-evidence/
          if-no-files-found: error
          retention-days: 14
