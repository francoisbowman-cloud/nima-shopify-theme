name: Theme validation

on:
  push:
    branches:
      - main
      - feat/nima-premium-mockup-implementation
    paths:
      - 'theme/**'
      - '.github/workflows/theme-validation.yml'
  pull_request:
    paths:
      - 'theme/**'
      - '.github/workflows/theme-validation.yml'

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Theme Check
        run: gem install theme-check --no-document

      - name: Run Theme Check
        run: theme-check theme --config theme/.theme-check.yml --fail-level error

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failures = []
          for path in Path('theme').rglob('*.json'):
              text = path.read_text(encoding='utf-8')
              stripped = text.lstrip()
              if stripped.startswith('/*'):
                  end = stripped.find('*/')
                  if end != -1:
                      stripped = stripped[end + 2:].lstrip()
              try:
                  json.loads(stripped)
              except Exception as exc:
                  failures.append(f'{path}: {exc}')

          if failures:
              raise SystemExit('\n'.join(failures))
          print('All theme JSON files parsed successfully.')
          PY
